<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | Timetable Portal</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <div class="card">

      <div class="header">
        <div>
          <p class="eyebrow">Administration</p>
          <h1 class="title">Admin Panel</h1>
          <p class="subtitle">Create timetable entries using existing subjects and rooms.</p>
        </div>
        <span class="badge">Admin</span>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" id="btnLoadLists" type="button">Load IDs</button>
        <button class="btn btn-secondary" id="btnGoTimetable" type="button">Open Timetable</button>
        <button class="btn btn-secondary" id="btnBack" type="button">Back</button>
      </div>

      <div class="message" id="msg"></div>

      <div class="form-row">
        <div class="grid2">
          <div>
            <label for="subjectId">Subject ID</label>
            <input id="subjectId" type="number" placeholder="e.g. 1" />
            <div class="muted">Use the subject list below to find the correct ID.</div>
          </div>
          <div>
            <label for="roomId">Room ID</label>
            <input id="roomId" type="number" placeholder="e.g. 1" />
            <div class="muted">Use the room list below to find the correct ID.</div>
          </div>
        </div>

        <div class="grid2">
          <div>
            <label for="day">Day</label>
            <select id="day">
              <option>Monday</option>
              <option>Tuesday</option>
              <option>Wednesday</option>
              <option>Thursday</option>
              <option>Friday</option>
            </select>
          </div>
          <div>
            <label>Time format</label>
            <input disabled value="Use the time pickers below" />
          </div>
        </div>

        <div class="grid2">
          <div>
            <label for="startTime">Start time</label>
            <input id="startTime" type="time" />
          </div>
          <div>
            <label for="endTime">End time</label>
            <input id="endTime" type="time" />
          </div>
        </div>

        <button class="btn btn-primary" id="btnCreate" type="button">Create Timetable Entry</button>
      </div>

      <div class="grid2">
        <div class="list">
          <h3>Subjects</h3>
          <div id="subjectsList"><span class="muted">Click "Load IDs" to show subjects.</span></div>
        </div>
        <div class="list">
          <h3>Rooms</h3>
          <div id="roomsList"><span class="muted">Click "Load IDs" to show rooms.</span></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const msg = document.getElementById("msg");
    const subjectsList = document.getElementById("subjectsList");
    const roomsList = document.getElementById("roomsList");

    function show(text, type = "info") {
      msg.textContent = text;
      msg.className = `message ${type}`;
    }

    function setLoading(button, isLoading, text) {
      button.disabled = isLoading;
      if (!button.dataset.label) button.dataset.label = button.textContent;
      button.textContent = isLoading ? text : button.dataset.label;
    }

    function renderList(items, labelKey) {
      if (!Array.isArray(items) || items.length === 0) return "<span class='muted'>Empty</span>";
      return items.map(x => `<div class="list-item"><code>${x.id}</code><span>${x[labelKey]}</span></div>`).join("");
    }

    async function loadIds() {
      const button = document.getElementById("btnLoadLists");
      setLoading(button, true, "Loading...");
      show("Loading subjects and rooms...");

      try {
        const sRes = await fetch("/api/subjects", { credentials: "include" });
        const sData = await sRes.json().catch(() => []);
        if (sRes.ok) subjectsList.innerHTML = renderList(sData, "name");
        else subjectsList.innerHTML = "<span class='muted'>Cannot load subjects</span>";

        const rRes = await fetch("/api/rooms", { credentials: "include" });
        const rData = await rRes.json().catch(() => []);
        if (rRes.ok) roomsList.innerHTML = renderList(rData, "name");
        else roomsList.innerHTML = "<span class='muted'>Cannot load rooms</span>";

        show("Subjects and rooms loaded", "success");
      } catch (e) {
        show("Network error", "error");
      } finally {
        setLoading(button, false);
      }
    }

    document.getElementById("btnLoadLists").addEventListener("click", loadIds);

    document.getElementById("btnCreate").addEventListener("click", async () => {
      const button = document.getElementById("btnCreate");
      setLoading(button, true, "Creating...");
      show("Creating timetable entry...");

      const subject_id = Number(document.getElementById("subjectId").value);
      const room_id = Number(document.getElementById("roomId").value);
      const day = document.getElementById("day").value;
      const start_time = document.getElementById("startTime").value;
      const end_time = document.getElementById("endTime").value;

      if (!subject_id || !room_id || !day || !start_time || !end_time) {
        show("Please fill all fields", "error");
        setLoading(button, false);
        return;
      }
      if (start_time >= end_time) {
  show("End time must be after start time", "error");
  setLoading(button, false);
  return;
      }

      try {
        const res = await fetch("/api/timetable", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ subject_id, room_id, day, start_time, end_time })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          show(data.message || "Create failed", "error");
          return;
        }

        show("Timetable entry created successfully", "success");
        document.getElementById("subjectId").value = "";
        document.getElementById("roomId").value = "";
        document.getElementById("startTime").value = "";
        document.getElementById("endTime").value = "";
      } catch (e) {
        show("Network error", "error");
      } finally {
        setLoading(button, false);
      }
    });

    document.getElementById("btnGoTimetable").addEventListener("click", () => {
      window.location.href = "/timetable.html";
    });

    document.getElementById("btnBack").addEventListener("click", () => {
      window.location.href = "/login.html";
    });
  </script>
</body>
</html>
